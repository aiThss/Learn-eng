server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Service worker và manifest không được cache bởi HTTP cache để PWA nhận bản mới.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Tài nguyên có tên hash trong /assets do Vite sinh ra, có thể cache lâu dài.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # Ảnh/icon không có hash chỉ cache ngắn để tránh kẹt logo cũ sau khi phát hành.
  location ~* \.(?:png|jpe?g|svg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public" always;
    try_files $uri =404;
  }

  # Fallback cho React Router: refresh trực tiếp route con không trả về 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
